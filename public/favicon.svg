<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <!-- Favicon optimized for 16x16, 32x32, 64x64 browser tabs -->
  <rect width="64" height="64" rx="16" fill="#075E54"/>
  <!-- Parchi Card -->
  <rect x="14" y="10" width="36" height="44" rx="6" fill="#FFFFFF"/>
  <rect x="22" y="8" width="20" height="6" rx="3" fill="#128C7E"/>
  <!-- Cute Eyes -->
  <circle cx="26" cy="26" r="3" fill="#075E54"/>
  <circle cx="38" cy="26" r="3" fill="#075E54"/>
  <!-- Smile -->
  <path d="M 28 32 Q 32 37 36 32" fill="none" stroke="#075E54" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Token Pill -->
  <rect x="18" y="38" width="28" height="11" rx="4" fill="#25D366"/>
  <text x="32" y="46" font-family="Arial, sans-serif" font-weight="900" font-size="8" fill="#075E54" text-anchor="middle">#1</text>
  <!-- Mini Heart Cross -->
  <circle cx="44" cy="16" r="4.5" fill="#EF4444"/>
  <path d="M 42.5 16 L 45.5 16 M 44 14.5 L 44 17.5" stroke="#FFF" stroke-width="1.2" stroke-linecap="round"/>
</svg>
