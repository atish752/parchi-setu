<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>ParchiSetu Official Clinic & Token Logo</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075E54"/>
      <stop offset="50%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="parchiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4EFEA"/>
    </linearGradient>
    <linearGradient id="stethoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#075E54" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Rounded Squircle with Emerald Glow -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#25D366" stroke-width="6" opacity="0.4" stroke-dasharray="16 12"/>

  <!-- Parchi (Cute Smiling Prescription Pad Character) -->
  <g filter="url(#softShadow)" transform="translate(0, 8)">
    <!-- Main Parchi Body -->
    <path d="M 160 110 
             L 320 110 
             A 24 24 0 0 1 344 134 
             L 344 380 
             A 28 28 0 0 1 316 408 
             L 164 408 
             A 28 28 0 0 1 136 380 
             L 136 134 
             A 24 24 0 0 1 160 110 Z" 
          fill="url(#parchiGrad)"/>

    <!-- Top Parchi Clip / Header (Hospital Badge) -->
    <rect x="196" y="94" width="88" height="28" rx="10" fill="#075E54"/>
    <circle cx="240" cy="108" r="5" fill="#25D366"/>

    <!-- Red/Pink Medical Cross Heart Badge on Top Left -->
    <g transform="translate(156, 134)">
      <circle cx="16" cy="16" r="15" fill="#EF4444"/>
      <path d="M 13 9 L 19 9 L 19 13 L 23 13 L 23 19 L 19 19 L 19 23 L 13 23 L 13 19 L 9 19 L 9 13 L 13 13 Z" fill="#FFFFFF"/>
    </g>

    <!-- Prescription Rx Symbol (Cute Golden) -->
    <text x="300" y="156" font-family="Arial, sans-serif" font-weight="900" font-size="22" fill="#D97706" text-anchor="middle">℞</text>

    <!-- Prescription Lines (Soft Slate) -->
    <line x1="168" y1="182" x2="312" y2="182" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="168" y1="200" x2="280" y2="200" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round"/>

    <!-- Cute Smiling Face -->
    <!-- Left Eye with Twinkle -->
    <ellipse cx="205" cy="246" rx="9" ry="12" fill="#1E293B"/>
    <circle cx="208" cy="242" r="3.5" fill="#FFFFFF"/>
    <circle cx="202" cy="250" r="1.5" fill="#FFFFFF"/>

    <!-- Right Eye with Twinkle -->
    <ellipse cx="275" cy="246" rx="9" ry="12" fill="#1E293B"/>
    <circle cx="278" cy="242" r="3.5" fill="#FFFFFF"/>
    <circle cx="272" cy="250" r="1.5" fill="#FFFFFF"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="188" cy="260" rx="10" ry="6" fill="#F472B6" opacity="0.6"/>
    <ellipse cx="292" cy="260" rx="10" ry="6" fill="#F472B6" opacity="0.6"/>

    <!-- Happy Smile -->
    <path d="M 226 256 Q 240 274 254 256" fill="none" stroke="#1E293B" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 233 264 Q 240 276 247 264 Z" fill="#F43F5E"/>

    <!-- Token Number Badge inside Parchi -->
    <rect x="180" y="296" width="120" height="42" rx="14" fill="#E8F5E9" stroke="#25D366" stroke-width="2.5"/>
    <text x="240" y="324" font-family="'Inter', sans-serif" font-weight="900" font-size="20" fill="#075E54" text-anchor="middle">
      TOKEN #1
    </text>

    <!-- Bottom Dots / Verified Wave -->
    <circle cx="216" cy="368" r="4" fill="#10B981"/>
    <circle cx="240" cy="368" r="5" fill="#25D366"/>
    <circle cx="264" cy="368" r="4" fill="#10B981"/>
  </g>

  <!-- Cute Doctor Stethoscope looping around the Parchi -->
  <g filter="url(#innerGlow)">
    <!-- Left Stethoscope Tube -->
    <path d="M 120 220 
             C 100 270, 104 350, 150 395 
             C 190 435, 290 435, 330 395 
             C 376 350, 380 270, 360 220" 
          fill="none" stroke="url(#stethoGrad)" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Chest Piece / Disc on the Right side -->
    <g transform="translate(356, 320)">
      <circle cx="0" cy="0" r="22" fill="#075E54" stroke="#25D366" stroke-width="5"/>
      <circle cx="0" cy="0" r="12" fill="#25D366"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Ear Tips at Top Left & Right -->
    <circle cx="120" cy="216" r="8" fill="#FFFFFF" stroke="#075E54" stroke-width="3"/>
    <circle cx="360" cy="216" r="8" fill="#FFFFFF" stroke="#075E54" stroke-width="3"/>
  </g>

  <!-- Little Sparkles of Joy -->
  <path d="M 104 150 L 109 135 L 124 130 L 109 125 L 104 110 L 99 125 L 84 130 L 99 135 Z" fill="#FDE047"/>
  <path d="M 390 130 L 394 118 L 406 114 L 394 110 L 390 98 L 386 110 L 374 114 L 386 118 Z" fill="#6EE7B7"/>
</svg>
